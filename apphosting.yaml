# Firebase App Hosting configuration for Bocaditos del Corazón.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Minimum viable sizing: 120 recipes, static JSON reads, no DB.
  # Bump memoryMiB to 1024 if we see OOM during build (Next 16 + Turbopack can spike).
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  timeoutSeconds: 60

# Environment variables.
#
# NEXT_PUBLIC_* values are safe to inline — they ship to the browser bundle
# anyway. The admin SDK authenticates via Application Default Credentials on
# Cloud Run (no service-account JSON needed on this side); FIREBASE_ADMIN_SA
# is only for local dev where you set GOOGLE_APPLICATION_CREDENTIALS.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDOX3AFVm6bwS806AiGChbA1mPY0Zgioa8
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    # Use the Firebase Hosting domain (same origin as the app) so
    # signInWithRedirect's sessionStorage state persists across the OAuth
    # bounce. Using firebaseapp.com here would make getRedirectResult()
    # silently return null (result stored on a different origin).
    value: biblioteca-amneris.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: biblioteca-amneris
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: biblioteca-amneris.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "552708898843"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:552708898843:web:9998652c716fe8926278be
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY
    value: 6LfKSWItAAAAAGZyQsXuI6c4tDogYe0YaGH9R8q_
    availability:
      - BUILD
      - RUNTIME
  # Force the JSON adapter at build time so prerendering never depends on
  # Firestore state. At runtime the admin SDK creds are present via ADC, so
  # the repo auto-detects Firestore and uses it for all live requests.
  - variable: REPO_ADAPTER
    value: json
    availability:
      - BUILD
