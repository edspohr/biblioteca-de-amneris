# Firebase App Hosting configuration for Bocaditos del Corazón.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Minimum viable sizing: 120 recipes, static JSON reads, no DB.
  # Bump memoryMiB to 1024 if we see OOM during build (Next 16 + Turbopack can spike).
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  timeoutSeconds: 60

# Environment variables for Firebase Auth (Phase 1).
# NEXT_PUBLIC_* values are safe to inline; the admin service-account JSON
# must be stored as a Secret Manager secret and referenced with `secret:`.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""              # TODO: paste from Firebase Console → Web app config
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "biblioteca-amneris.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "biblioteca-amneris"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "biblioteca-amneris.appspot.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: ""              # TODO: paste from Firebase Console
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""              # TODO: paste from Firebase Console
    availability: [BUILD, RUNTIME]
  # Admin SDK: store the entire service-account JSON as a secret named
  # `firebase-admin-sa` in Secret Manager, granted to the App Hosting SA.
  # Create with: firebase apphosting:secrets:set firebase-admin-sa
  - variable: FIREBASE_ADMIN_SA
    secret: firebase-admin-sa
    availability: [RUNTIME]
